name: JARVISiPad
options:
  bundleIdPrefix: com.flomberremix
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  JARVISiPad:
    type: application
    platform: iOS
    sources:
      - path: Sources/JARVISiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flomberremix.jarvisipad
        PRODUCT_NAME: JARVIS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JARVIS
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "JARVIS uses the microphone when you tap the voice button."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "JARVIS uses speech recognition to turn your spoken commands into text."
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "2"
