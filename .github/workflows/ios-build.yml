name: Native iPadOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "native/JARVISiPad/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: native/JARVISiPad
        run: xcodegen generate

      - name: Build for physical iPad (unsigned)
        working-directory: native/JARVISiPad
        run: |
          xcodebuild \
            -project JARVISiPad.xcodeproj \
            -scheme JARVISiPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: native/JARVISiPad
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/JARVIS.app package/Payload/
          cd package
          /usr/bin/zip -qry ../JARVIS-unsigned.ipa Payload

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unsigned-IPA
          path: native/JARVISiPad/JARVIS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
